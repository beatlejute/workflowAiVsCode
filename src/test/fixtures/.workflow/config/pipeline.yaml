pipeline:
  name: "test-pipeline"
  version: "1.0"

  agents:
    mock-agent:
      command: "node"
      args: ["-e", "console.log('Test stage completed'); process.exit(0)"]
      workdir: "."
      description: "Mock agent for e2e testing"

  default_agent: mock-agent

  stages:
    stage1:
      description: "Test stage 1"
      agent: mock-agent
      goto:
        default: stage2

    stage2:
      description: "Test stage 2"
      agent: mock-agent
      goto:
        default: end

  entry: stage1

  context:
    test: "true"

  execution:
    max_steps: 5
    delay_between_stages: 0
    timeout_per_stage: 10
    log_file: ".workflow/logs/pipeline.log"
