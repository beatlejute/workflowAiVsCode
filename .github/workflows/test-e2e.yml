name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Setup XVFB (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 2
          command: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run E2E Tests (Linux with xvfb)
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: xvfb-run -a npm run test:e2e

      - name: Run E2E Tests (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: npm run test:e2e

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ matrix.os }}
          path: |
            **/*.log
            **/test-results/
          retention-days: 7
