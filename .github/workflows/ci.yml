name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Run linter
        run: npm run lint:l10n

      # `npm run build` собирает только `dist/extension.js` (esbuild, один
      # outfile). Юнит-тесты запускаются из `dist/unit-test/**`, а E2E — из
      # `dist/test/**`; без этих двух шагов mocha отвечал `No test files found`,
      # а E2E падал на отсутствующем `runTests.js`.
      - name: Compile unit tests
        run: npm run test:compile-tests

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Compile E2E tests
        if: runner.os == 'Linux'
        run: npm run test:compile

      - name: Run E2E tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e